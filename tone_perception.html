<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhận diện Âm thanh · Sound Identification</title>

<style>
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg-1: #f4f7fb;
    --bg-2: #e9eef7;
    --card: rgba(255,255,255,0.88);

    --navy: #14233b;
    --navy-2: #243b5c;
    --blue: #3568d4;
    --blue-light: #eaf0ff;

    --green: #16845a;
    --green-light: #e8f7f0;

    --red: #c74b57;
    --border: rgba(24,52,88,0.10);

    --text: #17283f;
    --text-soft: #64748b;
    --muted: #8a98aa;

    --shadow:
        0 25px 60px rgba(30,55,90,0.12),
        0 4px 15px rgba(30,55,90,0.06);

    --radius-xl: 30px;
    --radius-lg: 22px;
    --radius-md: 16px;
}

html,
body {
    min-height: 100%;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(80,130,220,0.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(110,160,230,0.12),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            var(--bg-1),
            var(--bg-2)
        );

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 28px;
}

/* =========================================================
   MAIN APP
========================================================= */

.app {
    width: min(1080px, 100%);
    min-height: 720px;

    background: var(--card);

    border: 1px solid rgba(255,255,255,0.75);

    border-radius: var(--radius-xl);

    box-shadow: var(--shadow);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    padding: 34px 42px 28px;

    position: relative;

    overflow: hidden;
}

.app::before {
    content: "";
    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: rgba(80,125,220,0.06);

    top: -150px;
    right: -100px;

    pointer-events: none;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 24px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.brand-mark {
    width: 48px;
    height: 48px;

    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background:
        linear-gradient(
            145deg,
            #4778dc,
            #234a9d
        );

    box-shadow:
        0 8px 20px rgba(53,104,212,0.25);

    font-size: 21px;
    font-weight: 700;
}

.brand-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;

    color: var(--navy);
}

.brand-subtitle {
    font-size: 12px;
    color: var(--text-soft);

    margin-top: 4px;
}

.attribution {
    text-align: right;

    font-size: 10px;
    line-height: 1.55;

    color: var(--muted);

    padding-top: 2px;
}

.attribution strong {
    color: var(--navy-2);
    font-weight: 650;
}

/* =========================================================
   PHASE + PROGRESS
========================================================= */

.status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;
}

.phase-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 14px;

    border-radius: 999px;

    background: var(--blue-light);
    color: #2854a5;

    font-size: 12px;
    font-weight: 650;
}

.phase-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--blue);

    box-shadow: 0 0 0 4px rgba(53,104,212,0.10);
}

.progress-container {
    width: 100%;
    margin-bottom: 20px;
}

.progress-bar {
    width: 100%;
    height: 7px;

    background: #e5eaf2;

    border-radius: 999px;

    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #5d83df,
            #315fc4
        );

    border-radius: inherit;

    transition:
        width 0.35s cubic-bezier(.4,0,.2,1);
}

/* =========================================================
   DISPLAY AREA
========================================================= */

.display-area {
    width: 100%;
    height: 365px;

    border-radius: var(--radius-lg);

    background:
        linear-gradient(
            145deg,
            rgba(250,252,255,0.96),
            rgba(244,247,252,0.96)
        );

    border: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    overflow: hidden;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9);
}

.display-area::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(70,110,190,0.035),
            transparent 45%
        );

    pointer-events: none;
}

.display-content {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
    z-index: 2;
}

/* =========================================================
   INSTRUCTION
========================================================= */

.instruction-box {
    width: min(760px, 90%);

    text-align: center;
}

.instruction-kicker {
    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 1.8px;

    color: #71819a;

    margin-bottom: 15px;
}

.instruction-title {
    font-size: 28px;
    font-weight: 700;

    color: var(--navy);

    margin-bottom: 12px;

    letter-spacing: -0.6px;
}

.instruction-description {
    font-size: 17px;
    line-height: 1.8;

    color: #52647c;

    margin-bottom: 22px;
}

.question-emphasis {
    display: inline-block;

    padding: 8px 18px;

    border-radius: 12px;

    background: var(--blue-light);

    color: #2854a5;

    font-weight: 650;
}

.response-guide {
    display: flex;

    justify-content: center;

    gap: 16px;

    margin: 22px 0;
}

.response-card {
    min-width: 150px;

    padding: 15px 20px;

    background: white;

    border: 1px solid #e1e7f0;

    border-radius: 16px;

    box-shadow:
        0 5px 16px rgba(30,55,90,0.06);
}

.response-key {
    display: inline-flex;

    width: 40px;
    height: 32px;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background: var(--navy);

    color: white;

    font-size: 17px;
    font-weight: 700;

    margin-bottom: 7px;
}

.response-label {
    display: block;

    font-size: 13px;
    color: var(--text-soft);
}

/* =========================================================
   FIXATION
========================================================= */

.fixation {
    font-family: Arial, sans-serif;

    font-size: 62px;

    font-weight: 300;

    color: #263852;

    transform: translateY(-2px);
}

/* =========================================================
   QUESTION
========================================================= */

.question-wrapper {
    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    width: 100%;
}

.question-text {
    font-size: 27px;

    font-weight: 650;

    color: var(--navy);

    letter-spacing: -0.4px;

    margin-bottom: 30px;
}

.choice-hint {
    display: flex;
    gap: 120px;

    color: #52647c;

    font-size: 15px;
}

.choice {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 10px;
}

.choice kbd {
    display: inline-flex;

    min-width: 60px;
    height: 50px;

    align-items: center;
    justify-content: center;

    padding: 0 11px;

    border-radius: 12px;

    background: var(--navy);

    color: white;

    font-family: inherit;

    font-size: 22px;
    font-weight: 700;

    box-shadow:
        0 3px 0 #0d1829,
        0 5px 10px rgba(20,35,59,0.13);
}

.choice-label {
    display: block;
    font-size: 38px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 2px;
    margin-top: 6px;
}

kbd {
    display: inline-flex;

    min-width: 43px;
    height: 35px;

    align-items: center;
    justify-content: center;

    padding: 0 11px;

    border-radius: 10px;

    background: var(--navy);

    color: white;

    font-family: inherit;

    font-size: 15px;
    font-weight: 700;

    box-shadow:
        0 3px 0 #0d1829,
        0 5px 10px rgba(20,35,59,0.13);
}

/* =========================================================
   REST
========================================================= */

.rest-screen {
    text-align: center;
}

.rest-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 18px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--blue-light);

    color: var(--blue);

    font-size: 28px;
}

.rest-text {
    font-size: 28px;
    font-weight: 700;

    color: var(--navy);

    margin-bottom: 8px;
}

.rest-sub {
    color: var(--text-soft);

    font-size: 15px;

    margin-bottom: 22px;
}

/* =========================================================
   COMPLETE
========================================================= */

.complete-screen {
    text-align: center;
}

.complete-icon {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--green-light);

    color: var(--green);

    font-size: 34px;
    font-weight: 700;
}

.complete-title {
    font-size: 30px;

    font-weight: 700;

    color: var(--navy);

    margin-bottom: 8px;
}

.complete-sub {
    color: var(--text-soft);

    font-size: 15px;
}

/* =========================================================
   FEEDBACK
========================================================= */

.feedback {
    min-height: 24px;

    text-align: center;

    font-size: 14px;

    font-weight: 600;

    margin-top: 12px;
}

/* =========================================================
   CONTROL PANEL
========================================================= */

.control-panel {
    display: grid;

    grid-template-columns: 1fr auto;

    gap: 20px;

    align-items: center;

    margin-top: 18px;
}

.subject-section {
    display: flex;

    align-items: center;

    gap: 12px;
}

.subject-label {
    font-size: 13px;

    font-weight: 650;

    color: var(--navy-2);

    white-space: nowrap;
}

.subject-input {
    width: 210px;

    height: 42px;

    border-radius: 12px;

    border: 1px solid #d7dfeb;

    background: white;

    padding: 0 15px;

    outline: none;

    color: var(--navy);

    font-family: inherit;

    font-size: 14px;

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

.subject-input::placeholder {
    color: #a2adbc;
}

.subject-input:focus {
    border-color: #5b80d7;

    box-shadow:
        0 0 0 4px rgba(53,104,212,0.10);
}

.subject-input:disabled {
    background: #f1f4f8;
    color: #7a8799;
}

.button-group {
    display: flex;

    gap: 9px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    height: 42px;

    border: none;

    border-radius: 12px;

    padding: 0 20px;

    font-family: inherit;

    font-size: 13px;

    font-weight: 650;

    cursor: pointer;

    transition:
        transform 0.15s,
        box-shadow 0.15s,
        background 0.15s;

    white-space: nowrap;
}

.btn:hover:not(:disabled) {
    transform: translateY(-1px);
}

.btn:active:not(:disabled) {
    transform: translateY(0);
}

.btn-primary {
    color: white;

    background:
        linear-gradient(
            135deg,
            #4778dc,
            #315fc1
        );

    box-shadow:
        0 7px 16px rgba(53,104,212,0.22);
}

.btn-primary:hover:not(:disabled) {
    box-shadow:
        0 9px 20px rgba(53,104,212,0.28);
}

.btn-primary:disabled {
    background: #b7c3d6;

    box-shadow: none;

    cursor: not-allowed;
}

.btn-outline {
    color: #50637d;

    background: white;

    border: 1px solid #d7dfeb;
}

.btn-outline:hover:not(:disabled) {
    background: #f5f7fb;
}

.btn-outline:disabled {
    opacity: 0.45;

    cursor: not-allowed;
}

.btn-success {
    color: white;

    background:
        linear-gradient(
            135deg,
            #1a9465,
            #14784f
        );

    box-shadow:
        0 6px 15px rgba(22,132,90,0.18);
}

/* =========================================================
   DOWNLOAD
========================================================= */

.download-section {
    display: none;

    justify-content: center;

    gap: 10px;

    margin-top: 14px;
}

.download-section .btn {
    height: 38px;

    font-size: 12px;
}

/* =========================================================
   FOOTER INFO
========================================================= */

.bottom-info {
    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    margin-top: 18px;

    padding-top: 16px;

    border-top: 1px solid #e7ebf1;

    font-size: 11px;

    color: var(--text-soft);
}

.bottom-info .left {
    text-align: left;
}

.bottom-info .center {
    text-align: center;

    font-weight: 650;

    color: #77869a;
}

.bottom-info .right {
    text-align: right;
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden {
    display: none !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 760px) {

    body {
        padding: 12px;
    }

    .app {
        min-height: auto;

        padding: 24px 18px 20px;

        border-radius: 23px;
    }

    .header {
        flex-direction: column;

        margin-bottom: 18px;
    }

    .attribution {
        text-align: left;
    }

    .display-area {
        height: 350px;
    }

    .control-panel {
        grid-template-columns: 1fr;
    }

    .subject-section {
        width: 100%;
    }

    .subject-input {
        flex: 1;
        width: auto;
    }

    .button-group {
        justify-content: center;
    }

    .bottom-info {
        grid-template-columns: 1fr 1fr;

        row-gap: 8px;
    }

    .bottom-info .center {
        display: none;
    }

    .bottom-info .right {
        text-align: right;
    }

    .response-guide {
        gap: 9px;
    }

    .response-card {
        min-width: 125px;
    }

    .instruction-title {
        font-size: 23px;
    }

    .instruction-description {
        font-size: 15px;
    }

    .question-text {
        font-size: 22px;
    }

    .choice-hint {
        gap: 60px;
    }

    .choice-label {
        font-size: 28px;
    }
}

@media (max-width: 450px) {

    .brand-title {
        font-size: 17px;
    }

    .display-area {
        height: 320px;
    }

    .response-guide {
        flex-direction: column;
    }

    .response-card {
        min-width: 170px;
    }

    .question-text {
        font-size: 19px;
    }

    .choice-hint {
        gap: 30px;
        font-size: 13px;
    }

    .choice-label {
        font-size: 22px;
    }

    .subject-section {
        align-items: flex-start;
        flex-direction: column;
    }

    .subject-input {
        width: 100%;
    }

    .button-group {
        width: 100%;
    }

    .button-group .btn {
        flex: 1;
    }
}
</style>
</head>

function buildPracticeTrials(){
    const trials = [];
    for(const item of PRACTICE_DATA){
        for(let i = 0; i < item.rep; i++){
            trials.push({
                stimulus: item.stimulus,
                left_response: item.left_response,
                right_response: item.right_response,
                left_show: item.left_show,
                right_show: item.right_show,
                key: item.key,
                isPractice: true
            });
        }
    }
    shuffle(trials);
    return trials;
}

function buildFormalTrials(){
    const trials = [];
    for(const item of FORMAL_DATA){
        for(let i = 0; i < item.rep; i++){
            trials.push({
                stimulus: item.stimulus,
                left_response: item.left_response,
                right_response: item.right_response,
                left_show: item.left_show,
                right_show: item.right_show,
                isPractice: false
            });
        }
    }
    shuffle(trials);
    return trials;
}

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function getPracticeTotal(){
    let total = 0;
    for(const item of PRACTICE_DATA){
        total += item.rep;
    }
    return total;
}

function getFormalTotal(){
    let total = 0;
    for(const item of FORMAL_DATA){
        total += item.rep;
    }
    return total;
}

   COMPLETE

/* =========================================================
   AUDIO
========================================================= */

function stopAllAudio(){
    state.audioObjects.forEach(audio => {
        try {
            audio.pause();
            audio.currentTime = 0;
        } catch(e){}
    });
    state.audioObjects = [];
}


/* =========================================================
   TIME
========================================================= */

function getCurrentTime(){
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2,"0");
    const day = String(now.getDate()).padStart(2,"0");
    const hours = String(now.getHours()).padStart(2,"0");
    const minutes = String(now.getMinutes()).padStart(2,"0");
    const seconds = String(now.getSeconds()).padStart(2,"0");
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
}

function getExpStartTime(){
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2,"0");
    const day = String(now.getDate()).padStart(2,"0");
    const hours = String(now.getHours()).padStart(2,"0");
    const minutes = String(now.getMinutes()).padStart(2,"0");
    const seconds = String(now.getSeconds()).padStart(2,"0");
    return year + month + day + hours + minutes + seconds;
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){
    if(state.phase === "practice" || state.phase === "practice_complete"){
        const done = state.currentTrialIndex;
        const total = PRACTICE_TOTAL;
        const pct = Math.min(100, Math.round((done / total) * 100));
        progressFill.style.width = pct + "%";
        trialCounter.textContent = `Luyện tập: ${Math.min(done,total)} / ${total}`;
    }
    else if(state.phase === "formal"){
        const done = state.currentTrialIndex;
        const total = FORMAL_TOTAL;
        const pct = Math.min(100, Math.round((done / total) * 100));
        progressFill.style.width = pct + "%";
        trialCounter.textContent = `Chính thức: ${Math.min(done,total)} / ${total}`;
    }
}


/* =========================================================
   END TRIAL
========================================================= */

function endTrial(choice, rt, isTimeout = false){
    if(state.isTrialEnded) return;
    state.isTrialEnded = true;

    stopAllAudio();
    state.isWaitingResponse = false;
    state.allowKeyPress = false;
    state.trialActive = false;
    state.canRespondAfterSound2 = false;

    if(state.responseTimer){
        clearTimeout(state.responseTimer);
        state.responseTimer = null;
    }

    const session = state.isPractice ? "practice" : "exp";

    // Determine correctness for practice trials
    let correctVal = "NA";
    let responseVal = "NA";
    let rtVal = "NA";

    if(isTimeout){
        responseVal = "NA";
        rtVal = "NA";
        correctVal = "NA";
    } else {
        responseVal = choice;
        rtVal = rt !== null ? String(rt) : "NA";
        // For practice, check if response matches the key or left/right response
        if(state.isPractice){
            if(choice === state.currentLeftResponse || choice === state.currentLeftShow){
                correctVal = "correct";
            } else if(choice === state.currentRightResponse || choice === state.currentRightShow){
                correctVal = "incorrect";
            } else {
                correctVal = "NA";
            }
        } else {
            // For formal, check exact match
            if(choice === state.currentLeftResponse){
                correctVal = "correct";
            } else if(choice === state.currentRightResponse){
                correctVal = "incorrect";
            } else {
                correctVal = "NA";
            }
        }
    }

    const resultData = {
        subject: state.subjectId,
        session: session,
        time: getCurrentTime(),
        stimuli: state.currentSoundPath,
        left_show: state.currentLeftShow || "",
        right_show: state.currentRightShow || "",
        left_response: state.currentLeftResponse || "",
        right_response: state.currentRightResponse || "",
        response: responseVal,
        rt: rtVal,
        correct: correctVal
    };

    if(state.isPractice){
        state.practiceResults.push(resultData);
    } else {
        state.formalResults.push(resultData);
    }

    state.currentTrialIndex++;

    if(!isTimeout && rt !== null){
        rtDisplay.textContent = `RT：${rt} ms`;
    }

    if(state.phase === "formal" && state.currentTrialIndex % TRIAL_REST === 0 && state.currentTrialIndex < FORMAL_TOTAL){
        setTimeout(() => showRestScreen(), 500);
        return;
    }

    setTimeout(() => {
        state.isTrialEnded = false;
        runTrial();
    }, 500);
}


/* =========================================================
   PLAY AUDIO TWICE
========================================================= */

function playSoundSequence(soundPath){
    return new Promise((resolve) => {
        // Show question screen with current labels
        showQuestionScreen(state.currentLeftShow, state.currentRightShow);

        state.blockKeys = true;
        state.allowKeyPress = false;
        state.canRespondAfterSound2 = false;
        state.isTrialEnded = false;

        stopAllAudio();

        const audio1 = new Audio(soundPath);
        const audio2 = new Audio(soundPath);
        state.audioObjects = [audio1, audio2];

        let playCount = 0;
        let isResolved = false;

        function resolvePromise(){
            if(!isResolved){
                isResolved = true;
                resolve();
            }
        }

        function playFirst(){
            if(state.isTrialEnded){
                resolvePromise();
                return;
            }
            audio1.currentTime = 0;
            audio1.play().catch(() => {
                setTimeout(() => {
                    if(!state.isTrialEnded){
                        audio1.play().catch(() => {});
                    }
                }, 100);
            });
        }

        function playSecond(){
            if(state.isTrialEnded){
                resolvePromise();
                return;
            }
            audio2.currentTime = 0;
            audio2.play().catch(() => {
                setTimeout(() => {
                    if(!state.isTrialEnded){
                        audio2.play().catch(() => {});
                    }
                }, 100);
            });
        }

        audio1.addEventListener("ended", function onFirstEnd(){
            if(state.isTrialEnded){
                resolvePromise();
                return;
            }
            if(playCount === 0){
                playCount = 1;
                setTimeout(() => {
                    if(!state.isTrialEnded){
                        playSecond();
                    }
                }, 500);
            }
            audio1.removeEventListener("ended", onFirstEnd);
        });

        audio2.addEventListener("ended", function onSecondEnd(){
            if(state.isTrialEnded){
                resolvePromise();
                return;
            }
            if(playCount === 1){
                playCount = 2;
                state.sound2EndTime = performance.now();
                state.canRespondAfterSound2 = true;
                state.allowKeyPress = true;
                state.blockKeys = false;
                resolvePromise();
            }
            audio2.removeEventListener("ended", onSecondEnd);
        });

        audio1.load();
        audio1.addEventListener("canplaythrough", function onCanPlay(){
            if(!state.isTrialEnded){
                playFirst();
            }
            audio1.removeEventListener("canplaythrough", onCanPlay);
        });

        // Fallback timeout
        setTimeout(() => {
            if(playCount < 2){
                state.sound2EndTime = performance.now();
                state.canRespondAfterSound2 = true;
                state.allowKeyPress = true;
                state.blockKeys = false;
                resolvePromise();
            }
        }, 8000);
    });
}


/* =========================================================
   RUN TRIAL
========================================================= */

async function runTrial(){
    if(state.isFinished) return;
    if(state.isResting) return;

    const trials = state.phase === "practice" ? state.practiceTrials : state.formalTrials;

    if(state.currentTrialIndex >= trials.length){
        if(state.phase === "practice"){
            showPracticeCompleteScreen();
            return;
        } else {
            finishTest();
            return;
        }
    }

    const trial = trials[state.currentTrialIndex];

    state.currentSoundPath = trial.stimulus;
    state.currentLeftResponse = trial.left_response || "";
    state.currentRightResponse = trial.right_response || "";
    state.currentLeftShow = trial.left_show || "";
    state.currentRightShow = trial.right_show || "";
    state.isPractice = trial.isPractice || false;
    state.blockKeys = true;
    state.allowKeyPress = false;
    state.rt = null;
    state.trialActive = true;
    state.canRespondAfterSound2 = false;
    state.sound2EndTime = 0;
    state.isTrialEnded = false;

    updateProgress();

    await showFixation(500);

    state.isWaitingResponse = true;

    await playSoundSequence(trial.stimulus);

    if(state.isWaitingResponse && state.trialActive && !state.isTrialEnded){
        const timeoutDuration = 5000;
        if(state.responseTimer) clearTimeout(state.responseTimer);
        state.responseTimer = setTimeout(() => {
            if(state.isWaitingResponse && state.trialActive && !state.isTrialEnded){
                endTrial(null, null, true);
            }
        }, timeoutDuration);
    }
}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKey(e){
    const key = e.key;

    // SPACE
    if(key === " " || key === "Spacebar" || key === "Space"){
        e.preventDefault();

        if(state.isResting && !startBtn.disabled){
            continueFromRest();
            return;
        }

        if(state.isPracticeComplete && !startBtn.disabled){
            startFormalTest();
            return;
        }

        return;
    }

    // RESTART PRACTICE
    if(key === "ArrowLeft" && state.isPracticeComplete){
        e.preventDefault();
        restartPractice();
        return;
    }

    // RESPONSE - Left arrow or Right arrow
    if(key !== "ArrowLeft" && key !== "ArrowRight") return;

    if(state.blockKeys || !state.allowKeyPress || !state.trialActive) return;
    if(!state.canRespondAfterSound2) return;
    if(state.isTrialEnded) return;

    e.preventDefault();

    const choice = key === "ArrowLeft" ? state.currentLeftResponse : state.currentRightResponse;
    const now = performance.now();
    let rt = state.sound2EndTime > 0 ? Math.round(now - state.sound2EndTime) : null;

    endTrial(choice, rt, false);
}


/* =========================================================
   START FORMAL
========================================================= */

function startFormalTest(){
    if(!state.isPracticeComplete) return;

    state.isPracticeComplete = false;
    state.phase = "formal";
    state.currentTrialIndex = 0;

    phaseDisplay.textContent = "Chính thức";

    startBtn.textContent = "Đang chạy";
    startBtn.disabled = true;
    resetBtn.disabled = true;

    state.blockKeys = true;
    state.allowKeyPress = false;

    updateProgress();

    setTimeout(() => runTrial(), 300);
}


/* =========================================================
   RESTART PRACTICE
========================================================= */

function restartPractice(){
    state.isPracticeComplete = false;
    state.phase = "practice";
    state.currentTrialIndex = 0;
    state.practiceResults = [];
    state.practiceTrials = buildPracticeTrials();

    phaseDisplay.textContent = "Luyện tập";

    startBtn.textContent = "Đang chạy";
    startBtn.disabled = true;
    resetBtn.disabled = true;

    state.blockKeys = true;
    state.allowKeyPress = false;
    feedbackArea.textContent = "";

    updateProgress();

    setTimeout(() => runTrial(), 300);
}


/* =========================================================
   CONTINUE REST
========================================================= */

function continueFromRest(){
    if(!state.isResting) return;

    state.isResting = false;

    startBtn.textContent = "Đang chạy";
    startBtn.disabled = true;
    resetBtn.disabled = true;

    state.blockKeys = true;
    state.allowKeyPress = false;

    phaseDisplay.textContent = "Chính thức";

    setTimeout(() => runTrial(), 300);
}


/* =========================================================
   DATA GENERATION
========================================================= */

function generateDataFiles(){
    const allResults = [...state.practiceResults, ...state.formalResults];

    const headers = [
        "subject", "session", "time", "stimuli",
        "left_show", "right_show", "left_response", "right_response",
        "response", "rt", "correct"
    ];

    const rows = allResults.map(r => [
        r.subject, r.session, r.time, r.stimuli,
        r.left_show || "", r.right_show || "",
        r.left_response || "", r.right_response || "",
        r.response, r.rt, r.correct
    ]);

    let txtContent = headers.join("\t") + "\n";
    rows.forEach(row => {
        txtContent += row.join("\t") + "\n";
    });

    let csvContent = headers.join(",") + "\n";
    rows.forEach(row => {
        csvContent += row.join(",") + "\n";
    });

    return { txtContent, csvContent };
}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(content, filename, mimeType){
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}


/* =========================================================
   FINISH
========================================================= */

function finishTest(){
    state.isFinished = true;
    state.allowKeyPress = false;
    state.blockKeys = true;

    showCompleteScreen();

    feedbackArea.textContent = "";
    phaseDisplay.textContent = "Kết thúc";
    progressFill.style.width = "100%";
    trialCounter.textContent = `Chính thức: ${FORMAL_TOTAL} / ${FORMAL_TOTAL}`;

    startBtn.textContent = "✓ Hoàn tất";
    startBtn.disabled = true;
    resetBtn.disabled = true;
    subjectInput.disabled = true;

    downloadSection.style.display = "flex";

    console.log("Practice results:", state.practiceResults);
    console.log("Formal results:", state.formalResults);
}


/* =========================================================
   INITIALIZATION
========================================================= */

function initTest(){
    if(state.fixationTimer) clearTimeout(state.fixationTimer);
    if(state.responseTimer) clearTimeout(state.responseTimer);
    stopAllAudio();

    state.phase = "instruction";
    state.currentTrialIndex = 0;
    state.practiceResults = [];
    state.formalResults = [];
    state.isFinished = false;
    state.allowKeyPress = false;
    state.blockKeys = true;
    state.isWaitingResponse = false;
    state.trialActive = false;
    state.isStarted = false;
    state.subjectId = "";
    state.isPracticeComplete = false;
    state.canRespondAfterSound2 = false;
    state.isTrialEnded = false;
    state.isResting = false;
    state.hasDownloaded = false;

    state.practiceTrials = buildPracticeTrials();
    state.formalTrials = buildFormalTrials();

    showInstruction();

    subjectInput.disabled = false;
    subjectInput.value = "";

    startBtn.textContent = "▶ Bắt đầu";
    startBtn.disabled = true;

    resetBtn.disabled = false;

    feedbackArea.textContent = "";
    progressFill.style.width = "0%";
    trialCounter.textContent = `Luyện tập: 0 / ${PRACTICE_TOTAL}`;
    rtDisplay.textContent = "RT：--";
    downloadSection.style.display = "none";
}


/* =========================================================
   START
========================================================= */

function startTest(){
    if(state.isResting){
        continueFromRest();
        return;
    }

    if(state.isPracticeComplete){
        startFormalTest();
        return;
    }

    const subjectId = subjectInput.value.trim();
    if(subjectId.length === 0){
        alert("Vui lòng nhập mã người tham gia (Subject ID)");
        subjectInput.focus();
        return;
    }

    state.subjectId = subjectId;
    state.isStarted = true;
    subjectInput.disabled = true;

    startBtn.textContent = "Đang chạy";
    startBtn.disabled = true;
    resetBtn.disabled = true;

    state.phase = "practice";
    phaseDisplay.textContent = "Luyện tập";
    state.currentTrialIndex = 0;

    updateProgress();

    runTrial();
}


/* =========================================================
   DOWNLOAD STATE
========================================================= */

let downloadCount = 0;

function checkDownloadComplete(){
    downloadCount++;
    if(downloadCount >= 2){
        resetBtn.disabled = false;
        state.hasDownloaded = true;
        downloadCount = 0;
    }
}


/* =========================================================
   EVENTS
========================================================= */

document.addEventListener("keydown", handleKey);

subjectInput.addEventListener("input", () => {
    const subjectId = subjectInput.value.trim();
    if(subjectId.length > 0 && !state.isStarted && !state.isFinished){
        startBtn.disabled = false;
    } else {
        startBtn.disabled = true;
    }
});

subjectInput.addEventListener("keydown", e => {
    if(e.key === "Enter"){
        e.preventDefault();
        if(!startBtn.disabled) startTest();
    }
});

startBtn.addEventListener("click", startTest);

resetBtn.addEventListener("click", () => {
    if(state.isFinished && !state.hasDownloaded){
        alert("Vui lòng tải xuống cả hai file TXT và CSV trước khi đặt lại.\n\nPlease download both TXT and CSV files before resetting.");
        return;
    }

    const confirmed = confirm("Bạn có chắc chắn muốn đặt lại?\n\nTất cả dữ liệu hiện tại sẽ bị xóa.\n\nAre you sure you want to reset?");
    if(!confirmed) return;

    if(state.fixationTimer) clearTimeout(state.fixationTimer);
    if(state.responseTimer) clearTimeout(state.responseTimer);
    stopAllAudio();

    state.isFinished = true;
    downloadCount = 0;

    setTimeout(() => initTest(), 50);
});

downloadTxtBtn.addEventListener("click", () => {
    const { txtContent } = generateDataFiles();
    const filename = `subject_${state.subjectId}_${ExpStartTime}.txt`;
    downloadFile(txtContent, filename, "text/plain;charset=utf-8");
    checkDownloadComplete();
});

downloadCsvBtn.addEventListener("click", () => {
    const { csvContent } = generateDataFiles();
    const filename = `subject_${state.subjectId}_${ExpStartTime}.csv`;
    downloadFile(csvContent, filename, "text/csv;charset=utf-8");
    checkDownloadComplete();
});


/* =========================================================
   INIT
========================================================= */

initTest();

})();
</script>
